<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tadaaa! Khách đi lạc rồi - Sáng & Thu</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Baloo 2 (Font cute cho Tiêu đề/Nút) và Nunito (Nội dung) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Baloo 2"', 'cursive'],
            sans: ['Nunito', 'sans-serif'],
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-15px)' },
            }
          },
          animation: {
            'float': 'float 3.5s ease-in-out infinite',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#FFF8F0] min-h-screen flex items-center justify-center p-5 font-sans text-gray-800">
  <main class="max-w-md w-full text-center flex flex-col items-center">
    
    <!-- MINH HỌA CHIBI DÂU RỂ (ẢNH CỦA BẠN) -->
    <div class="relative w-full max-w-[280px] mx-auto mb-6">
      <!-- Bóng mờ dưới chân tạo cảm giác không gian -->
      <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-6 bg-orange-200/50 rounded-full blur-md"></div>
      
      <!-- Ảnh có hiệu ứng lơ lửng êm ái. Dán mã Base64 của bạn vào trong src="" -->
      <img 
        src="assets/anh_chibi.png" 
        alt="Chibi Couple" 
        class="relative w-full h-auto object-contain animate-float drop-shadow-2xl" 
      />
    </div>

    <!-- NỘI DUNG THÔNG BÁO -->
    <div class="w-full">
      <h1 class="font-display text-4xl md:text-5xl text-[#FF6B8B] font-extrabold mb-2 drop-shadow-sm">
        Tadaaa!
      </h1>
      <h2 class="font-display text-2xl md:text-3xl text-[#FF8DA1] font-bold mb-8">
        Quý khách nhầm link rồi 😅
      </h2>

      <!-- 2 NÚT ĐIỀU HƯỚNG NHÀ TRAI / NHÀ GÁI -->
      <div class="flex flex-col sm:flex-row gap-6 w-full px-2 justify-center mt-4">
        
        <!-- Nhà Trai -->
        <div class="flex flex-col items-center w-full sm:w-1/2">
          <p class="font-display text-gray-700 text-[16px] sm:text-[18px] mb-3 font-semibold h-12 flex items-end justify-center text-center">
            Link thiệp mời chú rể<br>thì theo lối này 👇
          </p>
          <a href="nha_trai.html" class="group flex items-center justify-center gap-2 w-full bg-[#4A90E2] hover:bg-[#357ABD] text-white font-bold py-3.5 px-4 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-300 font-display text-xl">
            🤵 Nhà Trai
          </a>
        </div>
        
        <!-- Nhà Gái -->
        <div class="flex flex-col items-center w-full sm:w-1/2">
          <p class="font-display text-gray-700 text-[16px] sm:text-[18px] mb-3 font-semibold h-12 flex items-end justify-center text-center">
            Link thiệp mời cô dâu<br>thì theo lối này 👇
          </p>
          <a href="nha_gai.html" class="group flex items-center justify-center gap-2 w-full bg-[#FF6B8B] hover:bg-[#E55A7A] text-white font-bold py-3.5 px-4 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-300 font-display text-xl">
            👰 Nhà Gái
          </a>
        </div>
        
      </div>
    </div>
  </main>
</body>
</html>
